<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>IKTA Bus — Live Bus Tracker</title>
  <meta name="description" content="IKTA Bus: see live buses on your route, how far they are and when they reach your stop. Works on Android and iPhone.">
  <meta name="theme-color" content="#2f5bff">
  <!-- Fastest map first paint: open connections to the map library + tile servers before anything else -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://tile.openstreetmap.org">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://ikta-bus-default-rtdb.firebaseio.com">
  <link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <link rel="modulepreload" href="js/passenger.js">
  <link rel="modulepreload" href="js/common.js">
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/favs.js">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" media="print" onload="this.media='all'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IKTA Bus">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>try{var t=JSON.parse(localStorage.getItem('ikta_theme'));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body class="map-page with-nav">
  <div id="map" role="application" aria-label="Live bus map"></div>

  <header class="topbar">
    <a class="brand" href="index.html"><img src="icons/icon.svg" alt="" width="34" height="34"><span class="txt">IKTA <b>Bus</b></span></a>
    <nav class="role-switch" aria-label="Switch account">
      <a href="index.html" class="active" aria-current="page"><i data-icon="user"></i><span>Passenger</span></a>
      <a href="driver.html"><i data-icon="wheel"></i><span>Driver</span></a>
      <a href="owner.html"><i data-icon="briefcase"></i><span>Owner</span></a>
    </nav>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
  </header>

  <div class="fabs">
    <button class="fab" id="locateBtn" aria-label="Show my location"><i data-icon="locate"></i></button>
    <button class="fab" id="alertBtn" aria-label="10-minute arrival alert"><i data-icon="bell"></i></button>
  </div>

  <aside class="sheet half" id="sheet" aria-label="Find a bus">
    <div class="sheet-handle" id="sheetHandle" role="button" aria-label="Expand or collapse panel" tabindex="0"></div>
    <div class="sheet-body" id="sheetBody">
      <form class="search-box" id="searchForm" autocomplete="off">
        <div class="search-rail"></div>
        <div class="loc-field">
          <span class="loc-dot"></span>
          <input class="input" id="fromInput" placeholder="From: current location or bus stop" aria-label="Source" enterkeyhint="next">
        </div>
        <div class="loc-field" style="position:relative">
          <span class="loc-dot dest"></span>
          <input class="input" id="toInput" placeholder="Where to? Type a bus stop" aria-label="Destination bus stop" enterkeyhint="search">
          <button type="button" class="swap-btn" id="swapBtn" aria-label="Swap source and destination"><i data-icon="swap"></i></button>
        </div>
      </form>

      <div class="row" style="margin-top:12px">
        <button class="btn btn-primary" id="searchBtn" style="flex:1"><i data-icon="search"></i> Find buses</button>
        <button class="btn btn-ghost" id="favRouteBtn" aria-label="Save route to favourites" title="Save route"><i data-icon="star"></i></button>
        <button class="btn btn-ghost hidden" id="clearBtn" aria-label="Clear search" title="Clear"><i data-icon="close"></i></button>
      </div>

      <div id="routeInfo" class="hidden">
        <div class="summary" id="summary"></div>
        <div class="chips" id="busChips" aria-label="Bus numbers on this route"></div>
      </div>
      <div class="summary hidden" id="nearHead"></div>

      <div class="bus-list" id="busList">
        <div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <p class="hint center" style="margin-top:14px">Tap 🟢🟡🔴⛔ on a bus to report how crowded it is and earn <b>5 IKTA Coins</b>.</p>
    </div>
  </aside>

  <nav class="bottom-nav" aria-label="Passenger">
    <a href="index.html" class="active" aria-current="page"><i data-icon="map"></i>Live map</a>
    <a href="favorites.html"><i data-icon="star"></i>Favourites</a>
    <a href="coins.html"><i data-icon="coin"></i>IKTA Coins</a>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin defer></script>
  <script src="js/map-boot.js" defer></script>
  <script type="module" src="js/passenger.js"></script>
</body>
</html>
