# Builds the Android app (android/) into an installable APK.
# - Every push to main that touches android/, and "Run workflow" on the Actions tab:
#   builds, signs, and puts the APK on the "android-latest" release, at
#   https://github.com/Avishek-Welcome/IKTA-Bus-Location/releases/download/android-latest/ikta-bus.apk
# - Pull requests: checks that the app still builds.
#
# Signing needs two repo secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the release keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD its password (key alias "ikta")
# Every update must be signed with this same keystore, or phones refuse to install it
# over the old app. Without the secrets the build still runs but isn't signed.
name: Android APK

on:
  push:
    branches: ["main"]
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      BUILD_TOOLS: "34.0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK parts
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;$BUILD_TOOLS" > /dev/null
      - name: Build
        env:
          # 100 + run number: always above the first hand-built release (version code 1)
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          export AAPT2="$BT/aapt2" D8="$BT/d8" ZIPALIGN="$BT/zipalign" APKSIGNER="$BT/apksigner"
          export VERSION_CODE=$((100 + VERSION_CODE))
          if [ "$HAS_KEY" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE="$RUNNER_TEMP/release.jks"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets not set, so the APK is not signed."
          fi
          android/build.sh
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: ikta-bus-apk
          path: android/build/ikta-bus*.apk
          if-no-files-found: error
      - name: Publish to the android-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Install on Android: download ikta-bus.apk on the phone, open it, and allow installing from this source when asked. Built from ${GITHUB_SHA::7}."
          if gh release view android-latest > /dev/null 2>&1; then
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest --title "IKTA Bus Android app" --notes "$notes" --target "$GITHUB_SHA" --latest
          fi
          gh release upload android-latest android/build/ikta-bus.apk --clobber
