# Deploy the website to Firebase Hosting (https://ikta-bus.web.app) on every push to main.
# Needs the repo secret FIREBASE_SERVICE_ACCOUNT (a service-account key JSON from
# Firebase console → Project settings → Service accounts → Generate new private key).
name: Deploy to Firebase Hosting

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Skip (FIREBASE_SERVICE_ACCOUNT secret not set)
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Add the FIREBASE_SERVICE_ACCOUNT repo secret to deploy to Firebase Hosting."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.HAS_KEY == 'true'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ikta-bus
          channelId: live
