# Builds the iPhone app (ios/).
# - Pull requests: checks that the app still builds.
# - Every push to main that touches ios/, and "Run workflow" on the Actions tab:
#   builds an unsigned ikta-bus-unsigned.ipa and puts it on the "ios-latest" release. An iPhone
#   won't install it as is; it is for sideloading tools that sign it with your own Apple ID.
#   Once the Apple Developer secrets below exist, it also signs the app and uploads it to
#   TestFlight, from where testers install it with Apple's TestFlight app.
#
# TestFlight needs an Apple Developer Program membership and these repo secrets
# (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID            10-character Team ID (developer.apple.com → Membership)
#   APPSTORE_API_KEY_ID      App Store Connect API key ID (Users and Access → Integrations, "Admin" access)
#   APPSTORE_API_ISSUER_ID   the Issuer ID shown above that key list
#   APPSTORE_API_KEY_P8      the full text of the downloaded AuthKey_XXXX.p8 file
# and an app record in App Store Connect with the same bundle ID (com.ikta.bus by default, or the
# repo variable IOS_BUNDLE_ID). Signing certificates and profiles are created automatically.
name: iOS app

on:
  push:
    branches: ["main"]
    paths: ["ios/**", ".github/workflows/ios-app.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_APPLE: ${{ secrets.APPSTORE_API_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.ikta.bus' }}
      BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - name: Build (unsigned)
        run: |
          xcodebuild -project IKTABus.xcodeproj -scheme IKTABus -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 30; test "${PIPESTATUS[0]}" = 0
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/IKTABus.app out/Payload/
          (cd out && zip -qry ikta-bus-unsigned.ipa Payload && rm -rf Payload)
          ls -l out
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ikta-bus-ios-unsigned
          path: ios/out/ikta-bus-unsigned.ipa
          if-no-files-found: error
      - name: Publish to the ios-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Unsigned iPhone build, for sideloading tools (such as Sideloadly or AltStore) that sign it with your own Apple ID. For normal installs use the website (Safari → Share → Add to Home Screen) or TestFlight. Built from ${GITHUB_SHA::7}."
          if gh release view ios-latest > /dev/null 2>&1; then
            gh release edit ios-latest --notes "$notes"
          else
            gh release create ios-latest --title "IKTA Bus iPhone app (unsigned)" --notes "$notes" --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload ios-latest out/ikta-bus-unsigned.ipa --clobber
      - name: Sign and upload to TestFlight
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_APPLE == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")
          xcodebuild -project IKTABus.xcodeproj -scheme IKTABus -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/IKTABus.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_STYLE=Automatic "${AUTH[@]}" archive | tail -n 30; test "${PIPESTATUS[0]}" = 0
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/IKTABus.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"
        shell: bash
